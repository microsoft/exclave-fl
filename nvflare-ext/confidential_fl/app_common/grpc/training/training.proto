// grpc communication between client and training exclave

syntax = "proto3";

package train;


service Train {
  // train rpc
  rpc StartTrain(GlobalModel) returns (Status) {}
  rpc GetWeight(ClientName) returns (WeightUpdate) {}
  rpc KeepAlive(ClientName) returns (Status) {}
}

// Input data and meta data
message GlobalModel {
  // serialized numpy arrays of global model weights
  map<string, bytes> global_model = 1;
}

message Status {
  bool received = 1;
}

message ClientName {
  string client_name = 1;
}

message WeightUpdate {
  // serialized numpy arrays of weight_diff
  map<string, bytes>  weight_update = 1;
  int64 epoch_len = 2;
}
