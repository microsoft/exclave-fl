static_resources:
  listeners:
  # Outbound network traffic listener.
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 15001
    listener_filters:
    - name: "envoy.filters.listener.original_dst"
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst
    - name: "envoy.filters.listener.http_inspector"
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
    - name: "envoy.filters.listener.tls_inspector"
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector 
    filter_chains:
    - filter_chain_match:
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config: 
          '@type': "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
          codec_type: AUTO
          stat_prefix: outbound_proxy
          forward_client_cert_details: ALWAYS_FORWARD_ONLY
          route_config: 
            name: all
            virtual_hosts:
              - name: outbound-pass-through 
                domains: 
                  - '*'
                routes:
                  - match: { prefix: "/"}
                    route:
                      cluster: outbound-pass-through 
                      timeout: 0s
          http_filters:
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config:
                name: dynamic_forward_proxy_cache_config
                dns_lookup_family: V4_ONLY
          - name: envoy.filters.http.router
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

  clusters:
  - name: outbound-pass-through
    lb_policy: CLUSTER_PROVIDED
    # keep idle connections alive: Azure drops TCP flows that are idle for about 4 minutes
    upstream_connection_options:
      tcp_keepalive: {keepalive_time: 60, keepalive_interval: 15, keepalive_probes: 3}
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: dynamic_forward_proxy_cache_config
          dns_lookup_family: V4_ONLY
    transport_socket:
      name: envoy.transport_sockets.att_tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.att_tls.v3.UpstreamAttTlsContext
        attested_tls_context:
          signing_context:
            certificate:
                filename: certs/server-cert.pem
            private_key:
                filename: keys/server-key.pem
            attestation_token:
                filename: attestation-token.txt
          validation_context:
            attestation_service_trusted_keys:
              filename: attestation-service-key.pem
            attestation_policy: $ATTESTATION_POLICY
        upstream_tls_context:
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              tls_maximum_protocol_version: TLSv1_3
            tls_certificates:
            - certificate_chain:
                filename: certs/server-cert.pem
              private_key:
                filename: keys/server-key.pem
            validation_context:
              trust_chain_verification: ACCEPT_UNTRUSTED
            alpn_protocols: ["h2,http/1.1"]
    http2_protocol_options: {}
